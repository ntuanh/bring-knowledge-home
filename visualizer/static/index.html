<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compiler Visualizer</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <h1>Compiler Visualizer</h1>
  <nav class="tabs" id="part-tabs">
    <button class="tab active" data-part="c">Part 1: C Compiler</button>
    <button class="tab" data-part="ai">Part 2: AI Compiler</button>
    <button class="tab" data-part="lab">Compiler Lab</button>
  </nav>
  <div class="topbar-right">
    <label class="lang">AI explanation language
      <select id="lang">
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
      </select>
    </label>
    <span id="health" class="health" title="Server status">connecting...</span>
  </div>
</header>
<div id="error-banner" class="error-banner" hidden></div>
<main>
  <section id="part-c" class="part"></section>
  <section id="part-ai" class="part" hidden></section>
  <section id="part-lab" class="part" hidden></section>
</main>
<script src="app.js"></script>
<script src="c_part.js"></script>
<script src="ai_part.js"></script>
<script src="lab.js"></script>
<script>App.start();</script>
</body>
</html>
